name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]  # (3.12: what the Aura client sets Autopilot up on)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true  # (a venv on PATH for the later steps: runners have no system 3.13)
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  roblox:
    # The Roblox Studio plugin's Luau compiles (luau-compile, Luau's own compiler: Studio itself can't run in CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Luau
        run: |
          curl -fsSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -q luau.zip -d luau
          echo "$PWD/luau" >> "$GITHUB_PATH"
      - name: Test
        run: pytest -q tests/test_roblox.py

  codex:
    # The Codex agent with Codex itself (the codex extra, ~150 MB): a whole run against a stand-in for OpenAI's API
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install
        run: uv pip install -e ".[dev,codex]"
      - name: Test
        run: pytest -q tests/test_codex.py
